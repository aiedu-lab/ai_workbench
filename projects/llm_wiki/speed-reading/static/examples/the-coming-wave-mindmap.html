    }

    #val-result.fail { color: #ff1744; }

      display: none;
      position: fixed; top: 50%; right: 18px;
      transform: translateY(-50%); z-index: 200;
      background: rgba(255,255,255,0.97);
      border: 1.5px solid #ddd; border-radius: 10px;
      padding: 16px 18px; width: 300px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);

    }

      font-size: 14px; font-weight: 700;
      color: #222; margin-bottom: 10px; line-height: 1.35;
    }

      font-size: 10px; font-weight: 700;

      color: #888; margin-top: 10px; margin-bottom: 3px;
    }
    .st { font-size: 12px; color: #333; line-height: 1.55; }
    #insp-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none;
      font-size: 16px; cursor: pointer; color: #888;
    }
    #insp-close:hover { color: #222; }

      position: fixed; bottom: 14px; right: 14px; z-index: 100;
      background: rgba(255,255,255,0.96);
      border: 1.5px solid #ccc; border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);

      text-transform: uppercase; letter-spacing: 0.06em;
      color: #555; margin-right: 10px;
    }

};
function lc(layer) { return LAYER_COLOR[layer] || "#888"; }
function isEmph(n) { return n.emphasis === "high"; }

// Emphasized: full-opacity, large font, thick border (Core Reading Path).
// Baseline: 88%-alpha, small font, thin border (background detail).
function nodeStyle(n) {
  const c = lc(n.layer), e = isEmph(n);
  return {
    borderColor: e ? c : c + "88",
    fontColor:   e ? c : c + "88",
    fontSize:    e ? 17 : 12,
    borderWidth: e ? 3  : 1.5
  };
}

// ── Build lookup and grouping maps ───────────────────────────────────
const nodeMap = {};
FALLBACK_CONTENT.forEach(n => { nodeMap[n.id] = n; });

const l2Nodes = FALLBACK_CONTENT.filter(n => n.layer === 2);
const l3All   = FALLBACK_CONTENT.filter(n => n.layer === 3);
const l4All   = FALLBACK_CONTENT.filter(n => n.layer === 4);

// childrenOf[parentId] = [child, …]
const childrenOf = {};
[...l3All, ...l4All].forEach(n => {
  if (!childrenOf[n.parent]) childrenOf[n.parent] = [];
  childrenOf[n.parent].push(n);
});

// ── Layer 2: evenly-spaced ellipse ring, starting at top ─────────────
// RX2=510, RY2=325: tight ring for 7 branch anchors.
const RX2 = 510, RY2 = 325, N2 = l2Nodes.length;

l2Nodes.forEach((n, i) => {
  n._angle = -Math.PI / 2 + (2 * Math.PI * i) / N2;
  n._x = RX2 * Math.cos(n._angle);
  n._y = RY2 * Math.sin(n._angle);
});

nodeMap["root"]._x = 0;
nodeMap["root"]._y = 0;

// ── Layer 3: sub-sector fan outside L2 ring ──────────────────────────
// R3=750 clears the L2 ellipse even for dense branches (5 children).
const R3 = 750;

l2Nodes.forEach((parent, pi) => {
  const kids = childrenOf[parent.id] || [];
  const nc   = kids.length;
  if (!nc) return;

  // Neighbor gap computation (handles angle wrap-around).
  const prevA = l2Nodes[(pi - 1 + N2) % N2]._angle;
  const nextA = l2Nodes[(pi + 1) % N2]._angle;
  let gPrev = parent._angle - prevA;
  if (gPrev <= 0) gPrev += 2 * Math.PI;
  let gNext = nextA - parent._angle;
  if (gNext <= 0) gNext += 2 * Math.PI;

  // 40% of the smaller gap keeps children inside their sector.
  // Per-child spread of 0.27 rad caps dense branches gracefully.
  const maxHalf  = Math.min(gPrev, gNext) * 0.40;
  const halfSpan = Math.max(
    Math.min(maxHalf, nc * 0.27 / 2), 0.14
  );

  kids.forEach((kid, ci) => {
    const angle = nc === 1
      ? parent._angle
      : parent._angle - halfSpan + (2 * halfSpan * ci) / (nc - 1);
    kid._angle = angle;
    kid._x = R3 * Math.cos(angle);
    kid._y = R3 * Math.sin(angle);
  });
});

// ── Layer 4: further-out fan from each L3 parent ─────────────────────
// R4=975 keeps L4 visually tethered to its L3 parent chain.
// Small half-span (0.10 rad per extra child) avoids inter-branch sprawl.
const R4 = 975;

l3All.forEach(parent => {
  const kids = childrenOf[parent.id] || [];
  const nc   = kids.length;
  if (!nc) return;

  const halfSpan = nc === 1 ? 0 : (nc - 1) * 0.10;

  kids.forEach((kid, ci) => {
    const angle = nc === 1
      ? parent._angle
      : parent._angle - halfSpan + (2 * halfSpan * ci) / (nc - 1);
    kid._angle = angle;
    kid._x = R4 * Math.cos(angle);
    kid._y = R4 * Math.sin(angle);
  });
});

// ── Collision resolution — L3 + L4 nodes together ───────────────────
// Cross-branch separation: 155px conservative footprint.
// Push factor 0.50 distributes displacement symmetrically.
const MIN_DIST = 155;
const allOuter = [...l3All, ...l4All];

for (let iter = 0; iter < 30; iter++) {
  let moved = false;
  for (let i = 0; i < allOuter.length; i++) {
    for (let j = i + 1; j < allOuter.length; j++) {
      const a = allOuter[i], b = allOuter[j];
      const dx = b._x - a._x, dy = b._y - a._y;
      const dist = Math.hypot(dx, dy);
      if (dist < MIN_DIST && dist > 0.001) {
        const push = (MIN_DIST - dist) / 2;
        const nx = dx / dist, ny = dy / dist;
        a._x -= nx * push * 0.50;
        a._y -= ny * push * 0.50;
        b._x += nx * push * 0.50;
        b._y += ny * push * 0.50;
        moved = true;
      }
    }
  }
  if (!moved) break;
}

// ── Label wrapping ────────────────────────────────────────────────────
function wrapLabel(label, maxChars) {
  const words = label.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const cand = line ? line + " " + w : w;
    if (cand.length <= maxChars) {
      line = cand;
    } else {
      if (line) lines.push(line);
      line = w;
    }
  }
  if (line) lines.push(line);
  return lines.join("\n");
}

// ── Build vis-network nodes ───────────────────────────────────────────
// maxC controls ellipse width: root 20, L2 14, L3 17, L4 16.
const visNodes = [];

FALLBACK_CONTENT.forEach(n => {
  const s = nodeStyle(n);
  const maxC = n.layer === 1 ? 20 :
               n.layer === 2 ? 14 :
               n.layer === 3 ? 17 : 16;
  const wrapped = wrapLabel(n.label, maxC);

  visNodes.push({
    id: n.id,
    label: wrapped,
    x: n._x ?? 0,
    y: n._y ?? 0,
    fixed: { x: true, y: true },
    physics: false,
    shape: "ellipse",
    color: {
      background: "#ffffff",
      border: s.borderColor,
      highlight: { background: "#fffde7", border: s.borderColor },
      hover:      { background: "#fffde7", border: s.borderColor }
    },
    font: {
      color: s.fontColor,
      size:  s.fontSize,
      face:  "Segoe UI, system-ui, sans-serif",
      bold:  { color: s.fontColor, size: s.fontSize, mod: "bold" }
    },
    borderWidth: s.borderWidth,
    borderWidthSelected: s.borderWidth + 1,
    widthConstraint: {
      minimum: 85,
      maximum: n.layer === 1 ? 210 : 165
    }
  });
});

// ── Build vis-network edges ───────────────────────────────────────────
// Single Arrow OR Edges Rule: pure hierarchy — no arrowheads on any edge.
// Parallel Bowing Mandate: curvedCW on all edges; sibling arcs bow
// in the same direction and cannot intersect within a branch fan.
// Edge emphasis mirrors child node: Core Reading Path = thick+opaque;
// baseline = thin+faded.
const visEdges = [];

FALLBACK_CONTENT.forEach(n => {
  if (!n.parent) return;
  const e = isEmph(n);
  const c = lc(n.layer);
  visEdges.push({
    from: n.parent,
    to:   n.id,
    arrows: "",
    color: {
      color:     e ? c : c + "88",
      highlight: e ? c : c + "88",
      hover:     e ? c : c + "88"
    },
    width: e ? 3.5 : 1.0,
    smooth: { enabled: true, type: "curvedCW", roundness: 0.12 }
  });
});

// ── Initialise vis-network ────────────────────────────────────────────
const container = document.getElementById("network-container");
const network = new vis.Network(
  container,
  {
    nodes: new vis.DataSet(visNodes),
    edges: new vis.DataSet(visEdges)
  },
  {
    nodes: { shape: "ellipse", borderWidth: 1.5, font: { size: 13 } },
    edges: {
      smooth: { enabled: true, type: "curvedCW", roundness: 0.12 },
      arrows: { to: { enabled: false } }
    },
    physics: { enabled: false },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      zoomView: true,
      dragView: true,
      dragNodes: false
    }
  }
);

// ── Post-draw: fit viewport then run validation ───────────────────────
// Single afterDrawing handler avoids race conditions between two
// competing `once` registrations.
network.once("afterDrawing", () => {
  network.fit({
    animation: { duration: 400, easingFunction: "easeInOutQuad" }
  });
  // Positions are fixed; validation reads _x/_y, not canvas coords.
  setTimeout(runValidation, 500);
});

// ── Inspector (node selection drawer) ────────────────────────────────
let activeId = null;
const inspector = document.getElementById("inspector");
const inspLabel = document.getElementById("insp-label");
const inspWhat  = document.getElementById("insp-what");
const inspWhy   = document.getElementById("insp-why");

document.getElementById("insp-close").addEventListener("click", () => {
  inspector.style.display = "none";
  activeId = null;
});

network.on("click", params => {
  if (params.nodes.length > 0) {
    const id = params.nodes[0];
    if (id === activeId) {
      // Toggle off when same node is clicked again.
      inspector.style.display = "none";
      activeId = null;
    } else {
      const n = nodeMap[id];
      if (n) {
        // Use original (unwrapped) label in inspector heading.
        inspLabel.textContent = n.label;
        inspWhat.textContent  = n.what;
        inspWhy.textContent   = n.why;
        inspector.style.display = "block";
        activeId = id;
      }
    }
  } else {
    inspector.style.display = "none";
    activeId = null;
  }
});

// ── Legend toggle ─────────────────────────────────────────────────────
let legOpen = true;
const legBody = document.getElementById("leg-body");
const legBtn  = document.getElementById("leg-btn");
document.getElementById("leg-hdr").addEventListener("click", () => {
  legOpen = !legOpen;
  legBody.style.display = legOpen ? "block" : "none";
  legBtn.innerHTML      = legOpen ? "&#x25BC;" : "&#x25B2;";
});

// ── Geometry validation ───────────────────────────────────────────────
// Checks center-to-center distances within each layer using computed
// _x/_y fixed positions. Thresholds are conservative ellipse footprints.
// L2: 110px  L3: 140px  L4: 130px
function runValidation() {
  let fails = 0;

  function checkLayer(nodes, minDist) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        if (Math.hypot(b._x - a._x, b._y - a._y) < minDist) fails++;
      }
    }
  }

  checkLayer(l2Nodes, 110);
  checkLayer(l3All,   140);
  checkLayer(l4All,   130);

  const el = document.getElementById("val-result");
  if (fails === 0) {
    el.textContent = "PASS — no collisions";
    el.className   = "pass";
  } else {
    el.textContent = "FAIL — " + fails + " collision(s)";
    el.className   = "fail";
  }
}
</script>
</body>
</html>
