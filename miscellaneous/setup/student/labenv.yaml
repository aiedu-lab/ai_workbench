# Non-confidential lab environment variables.
# Load with: python3 setup/labsetup.py
#
# Replace <CLASS_ID> and <hostname> with values for this run
# before distributing to students.
#
# NEVER add MY_DISCORD_WEBHOOK_URL here — distribute it via the
# #meetup-notifications channel message (instructor.md Section 2).

# Discord server name created in instructor.md Section 2.
# Format: meetup-lab-<CLASS_ID>  (e.g. meetup-lab-2026-spring)
DISCORD_SERVER: "meetup-lab-2026-spring"


# Lab server reachable from student laptops, either directly on
# the lab LAN (internal) or via port-forwarded WAN (external).
# Must resolve to an IP with a DOCKER_SERVER_USERNAME
# account and Docker installed
# as provisioned in instructor.md Section 3
# labsetup.py writes two ~/.ssh/config entries: ailabvm-int (the
# internal address/port below) and ailabvm (the external
# address/port below, the default for students connecting via
# the Internet).
# Format: <hostname/ip> (e.g. labserver.example.com or 70.10.5.10)
DOCKER_SERVER_ID_INTERNAL: "192.168.4.43"
DOCKER_SERVER_SSH_PORT_INTERNAL: 22

DOCKER_SERVER_ID_EXTERNAL: "73.202.223.27"
DOCKER_SERVER_SSH_PORT_EXTERNAL: 22439

# username for SSH on the lab server.
# Foramt: <username> (e.g. ailabuser)
DOCKER_SERVER_USERNAME: "ailabuser"

# AI-GENERATED: Phase 51 Step 51.1 (plan.md)
# Lab server's PUBLIC SSH host key (not a secret). labsetup.py
# writes it to ~/.ssh/known_hosts for both addresses above, so the
# BatchMode SSH checks trust the server on a fresh machine without
# an interactive "trust this host?" prompt. Update it whenever the
# server is (re)provisioned. On the server, read it with:
#   cat /etc/ssh/ssh_host_ed25519_key.pub   (drop the trailing comment)
# and check the fingerprint with: ssh-keygen -lf <file>
# Format: <type> <base64>  (e.g. ssh-ed25519 AAAAC3Nz...)
DOCKER_SERVER_HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPPHrYVUMx9kbcDxYoTQgvmuM25qMdt190CGdRL3bnVm"

# Permanent Google Form URL for student roster collection.
# Created once by the instructor (see instructor.md Section 1).
# Students open this URL during the Introduction session to submit
# their name, email, GitHub username, and Discord username.
# Responses are private — only the form owner can see them.
# Format: https://forms.gle/...  (never changes across cohorts)
GOOGLE_FORM_URL: "https://forms.gle/dcidy3esnceXypXn8"
